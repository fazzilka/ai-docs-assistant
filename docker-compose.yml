name: ai-docs-assistant

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-api_docs}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-bge-m3}
      VECTOR_SIZE: ${VECTOR_SIZE:-1024}
      API_KEY: ${API_KEY:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ollama/qwen2.5:7b}
      OLLAMA_API_BASE: http://ollama:11434
      OTEL_SDK_DISABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./docs:/app/docs
      - app_logs:/app/logs
    depends_on:
      qdrant:
        condition: service_started
      ollama-models:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-models:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull bge-m3
        ollama pull qwen2.5:7b
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_data:/root/.ollama

volumes:
  app_logs:
  ollama_data:
  qdrant_data:
